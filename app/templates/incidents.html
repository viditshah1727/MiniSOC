{% extends "base.html" %}
{% block title %}Incidents{% endblock %}
{% block page_title %}Incident Management{% endblock %}

{% block content %}
<div class="filterbar">
  <label class="f">Search
    <input type="search" id="f-q" placeholder="title, IP, host, user…" style="width:220px">
  </label>
  <label class="f">Severity
    <select id="f-severity">
      <option value="">All</option>
      <option value="CRITICAL">Critical</option><option value="HIGH">High</option><option value="MEDIUM">Medium</option>
      <option value="LOW">Low</option><option value="INFO">Informational</option>
    </select>
  </label>
  <label class="f">Status
    <select id="f-status">
      <option value="">All</option>
      <option>OPEN</option><option>INVESTIGATING</option><option>CONTAINED</option>
      <option>RESOLVED</option><option>CLOSED</option>
    </select>
  </label>
  <button class="btn primary" id="f-apply">Apply</button>
  <button class="btn" id="f-clear">Clear</button>
</div>

<div class="panel">
  <h3>Incidents <span class="right dim" id="incident-count"></span></h3>
  <div class="table-wrap">
    <table class="data">
      <thead><tr>
        <th>ID</th><th>Title</th><th>Severity</th><th>Status</th><th>Source IP</th>
        <th>Affected Host</th><th>Affected User</th><th>MITRE</th>
        <th>Analyst</th><th>Created</th><th>Alerts</th>
      </tr></thead>
      <tbody id="incidents-body"><tr><td colspan="11" class="empty">Loading…</td></tr></tbody>
    </table>
  </div>
  <div class="pager">
    <button class="btn small" id="pg-prev">‹ Prev</button>
    <span id="pg-info"></span>
    <button class="btn small" id="pg-next">Next ›</button>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/incidents.js') }}"></script>
{% endblock %}
